<!doctype html>
<html lang="en">
  <head>
    <link rel="preload" as="image" href="/images/hero/haven-home-hero-desktop.webp" media="(min-width: 1024px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hero/haven-home-hero-tablet.webp" media="(min-width: 768px) and (max-width: 1023px)" />
    <link rel="preload" as="image" href="/images/hero/haven-home-hero-mobile.webp" media="(max-width: 767px)" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="meta-theme-color" name="theme-color" content="#10B981" />
    <script>
      (function() {
        try {
          var settings = localStorage.getItem("haven_brand_settings");
          if (settings) {
            var brand = JSON.parse(settings);
            var root = document.documentElement;
            if (brand.primary_color) {
              root.style.setProperty('--brand-primary', brand.primary_color);
              var metaTheme = document.getElementById('meta-theme-color');
              if (metaTheme) metaTheme.content = brand.primary_color;
            }
            if (brand.background_color) root.style.setProperty('--brand-background', brand.background_color);
            if (brand.logo_url) {
              var logoImg = document.getElementById('splash-logo');
              if (logoImg) logoImg.src = brand.logo_url;
            }
            if (brand.platform_name) {
              var titleEl = document.getElementById('splash-title');
              if (titleEl) titleEl.textContent = brand.platform_name;
              document.title = brand.platform_name;
            }
            if (brand.tagline) {
              var subtitleEl = document.getElementById('splash-subtitle');
              if (subtitleEl) subtitleEl.textContent = brand.tagline;
            }
          }
        } catch (e) { /* non-blocking fallback */ }
      })();
    </script>

    <!-- App identity -->
    <meta name="author" content="Haven Home Hub" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Haven Home Hub" />

    <!-- SEO -->
    <meta name="description" content="Find verified property listings across the United States — buy, rent, or invest with trusted agents." />
    <link rel="canonical" href="https://havenhomehub.com/" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Haven Home Hub" />
    <meta property="og:description" content="Find verified property listings across the United States — buy, rent, or invest with trusted agents." />
    <meta property="og:image" content="https://havenhomehub.com/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Haven Home Hub — Real Estate & Property Investments" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://havenhomehub.com/logo.png" />

    <title>Haven Home Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet" />

    <style>
      :root {
        --brand-primary: #10B981;
        --brand-background: #F8FAFC;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--brand-background, #F8FAFC);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #0F172A;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes splashFadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splashGlow {
        0%, 100% { transform: scale(1); opacity: 0.2; }
        50% { transform: scale(1.15); opacity: 0.4; }
      }
      @keyframes splashBar {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(60%); }
        100% { transform: translateX(250%); }
      }
      .splash-container {
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--brand-background, #F8FAFC);
        animation: splashFadeIn 0.35s ease-out forwards;
      }
      .splash-card-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-glow {
        position: absolute;
        inset: -8px;
        border-radius: 24px;
        background: var(--brand-primary, #10B981);
        filter: blur(14px);
        animation: splashGlow 2.4s ease-in-out infinite;
      }
      .splash-logo-card {
        position: relative;
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: #FFFFFF;
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 12px 30px -6px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        overflow: hidden;
      }
      .splash-logo-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .splash-fallback-svg {
        display: none;
        width: 38px;
        height: 38px;
        color: var(--brand-primary, #10B981);
      }
      .splash-title {
        margin-top: 20px;
        font-family: 'Poppins', sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: #0F172A;
        letter-spacing: -0.02em;
        text-align: center;
      }
      .splash-subtitle {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #64748B;
        text-align: center;
      }
      .splash-progress-track {
        margin-top: 24px;
        width: 130px;
        height: 3px;
        background: rgba(15, 23, 42, 0.06);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }
      .splash-progress-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 50%;
        background: var(--brand-primary, #10B981);
        border-radius: 99px;
        animation: splashBar 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="app-splash" class="splash-container">
        <div class="splash-card-wrapper">
          <div class="splash-glow"></div>
          <div class="splash-logo-card">
            <img
              id="splash-logo"
              src="/logo.png"
              alt="Haven Home Hub"
              class="splash-logo-img"
              onerror="this.style.display='none'; document.getElementById('splash-fallback-icon').style.display='block';"
            />
            <svg id="splash-fallback-icon" class="splash-fallback-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
        </div>
        <h1 id="splash-title" class="splash-title">Haven Home Hub</h1>
        <p id="splash-subtitle" class="splash-subtitle">Smart Property Investment</p>
        <div class="splash-progress-track">
          <div class="splash-progress-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
